intent: "romance_military"
description: "Detects online romance scams, fake overseas military/surgeons/oil rig engineers requesting wire transfers or gift cards."
category: "romance_fraud"
weight: 90
priority: "high"
phrases:
  - "deployed overseas"
  - "oil rig engineer"
  - "military peacekeeper"
  - "cannot video call right now"
  - "camera is broken on base"
  - "need money for leave papers"
  - "pay flight ticket to see you"
  - "customs fee for gold box"
  - "package of personal belongings held"
  - "diplomatic courier delivery fee"
  - "medical bill for emergency surgery"
  - "send apple gift card for food"
  - "steam card to buy wifi"
  - "i love you so much honey"
  - "never felt this connection before"
patterns:
  - "send money for my flight"
  - "need money to pay for medical"
  - "customs is holding my package"
  - "cannot do video call because"
regex:
  - "\\b(deployed\\s+in|stationed\\s+in|peacekeeping\\s+mission)\\b"
  - "\\b(oil\\s+rig|orthopedic\\s+surgeon\\s+overseas)\\b"
  - "\\b(customs|diplomatic\\s+courier)\\s+(holding|clearance|tax)\\b"
  - "\\b(steam|apple|itunes|google\\s+play)\\s+card\\s+for\\s+(food|wifi|medical)\\b"
