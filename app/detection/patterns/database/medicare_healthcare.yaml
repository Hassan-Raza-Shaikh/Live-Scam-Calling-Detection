intent: "medicare_healthcare"
description: "Detects Medicare card replacement fraud, free genetic cancer screening kits, pain management back brace scams, and health plan enrollment scams."
category: "healthcare_fraud"
weight: 92
priority: "high"
phrases:
  - "medicare card replacement"
  - "new chip medicare card"
  - "free genetic cancer screening"
  - "dna swab kit"
  - "orthopedic back brace"
  - "pain management relief kit"
  - "covered by medicare at no cost"
  - "confirm your medicare number"
  - "medicare part d update"
  - "open enrollment deadline today"
  - "health insurance subsidy"
  - "zero dollar premium benefit"
  - "eligible for cash assistance card"
  - "grocery allowance card for seniors"
patterns:
  - "read your red white and blue medicare number"
  - "qualify for free genetic screening"
  - "send you a free knee brace"
  - "your medicare card is expiring"
regex:
  - "\\b(new\\s+chip|plastic|replacement)\\s+medicare\\s+card\\b"
  - "\\b(free|covered)\\s+(dna|genetic|cancer|covid)\\s+(screening|swab|kit)\\b"
  - "\\b(orthopedic|knee|back|wrist)\\s+(brace|device)\\s+(at\\s+no\\s+cost|free)\\b"
  - "\\b(grocery|flex|spending)\\s+allowance\\s+card\\b"
