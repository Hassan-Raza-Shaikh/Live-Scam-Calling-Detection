intent: "job_employment_task"
description: "Detects work-from-home task scams, YouTube/TikTok video liking tasks, fake check equipment purchases, and secret shopper scams."
category: "employment_fraud"
weight: 90
priority: "high"
phrases:
  - "work from home job"
  - "part time remote work"
  - "earn 300 to 800 daily"
  - "like youtube videos for money"
  - "rate hotel on google maps"
  - "task optimization job"
  - "secret mystery shopper"
  - "deposit check for home office supplies"
  - "buy equipment from our certified vendor"
  - "wire back excess check funds"
  - "telegram hr recruiter"
  - "whatsapp job interview"
  - "complete daily commission tasks"
  - "deposit funds to unblock high commission task"
patterns:
  - "earn money by liking videos"
  - "send you a check to purchase equipment"
  - "deposit check into your bank account and wire"
  - "pay fee to unlock task commission"
regex:
  - "\\b(earn|make)\\s+\\$?\\d+\\s*(to|-)\\s*\\$?\\d+\\s*(daily|per\\s+day|an\\s+hour)\\b"
  - "\\b(like|watch)\\s+(youtube|tiktok|instagram)\\s+video[s]?\\s+for\\s+(money|commission|pay)\\b"
  - "\\b(deposit|cash)\\s+(the\\s+check|cashier[']?s?\\s+check)\\s+and\\s+(wire|zelle|send)\\b"
  - "\\b(home\\s+office|certified\\s+vendor)\\s+(equipment|supplies|hardware)\\b"
