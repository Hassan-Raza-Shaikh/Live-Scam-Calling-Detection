[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-ai"
version = "0.1.0"
description = "Real-time Live Scam Calling Detection & Agentic Defense System"
readme = "README.md"
authors = [
    { name = "Sentinel AI Team", email = "info@sentinel-ai.org" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "websockets>=12.0",
    "langchain>=0.1.15",
    "langgraph>=0.0.35",
    "langchain-community>=0.0.32",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "faster-whisper>=1.0.1",
    "silero-vad>=5.1",
    "chromadb>=0.4.24",
    "numpy>=1.26.4",
    "scipy>=1.12.0",
    "pyaudio>=0.2.14",
    "sounddevice>=0.4.6",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.3",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "black>=24.3.0",
    "ruff>=0.3.4",
    "mypy>=1.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["tests"]
